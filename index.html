<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Lecteur Groupe Folklorique NDZOUANA</title>
    <link rel="stylesheet" href="assets/audioPlayer.css">
</head>
<body>
    <!-- Custom Audio Player !-->
    <div class="player-container">
      <audio id="audioPlayer" class="audio" preload=”metadata” controls> No HTML5 support!</audio>

      <!-- Main Control Bar !-->
      <div class="controlBar">
          <!-- Back Button !-->
          <div class="buttonContainer" id="backButton">
              <div class="icon icon-backward player-button" aria-hidden="true"></div>
          </div>

          <!-- Play Button !-->
          <div class="buttonContainer" id="playButton" >
              <div class="icon icon-play player-button" aria-hidden="true"></div>
          </div>

          <!-- Forward Button !-->
          <div class="buttonContainer" id="forwardButton">
              <div class="icon icon-forward player-button" aria-hidden="true"></div>
          </div>

          <!-- Progress Indicator !-->
          <div style="width: calc(var(--width) * 0.30);">
              <div id="progressRail">
                  <div id="progressBar"></div>
              </div>
          </div>

          <!-- Time Text !-->
          <div class="currentTime"> </div>
          <div class="totalTime"> </div>

          <!-- Volume Button !-->
          <div class="buttonContainer" id="muteButton">
              <div class="icon icon-volume-up player-button" aria-hidden="true"></div>
          </div>

          <!-- Volume Indicator !-->
          <div style="width: calc(var(--width) * 0.20);">
              <div id="volumeRail">
                  <div id="volumeBar"></div>
              </div>
          </div>
      </div>
      <!-- End Main Control Bar !-->

      <!-- Playlists !-->
      <div id="playlist">
        <!-- Mantsieme_2024 -->
        <a class="playlist-item active" href="https://archive.org/download/2-mbali-a-ngo-10.00/1-Mukoo_Ku_Mbe-6.42.mp3">Mantsieme_2024 - 1-Mukoo Ku Mbe (6:42)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/2-Mbali_a_Ngo-10.00.mp3">Mantsieme_2024 - 2-Mbali a Ngo (10:00)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/3-Nga_Ulah_Mu_Mayele-5.23.mp3">Mantsieme_2024 - 3-Nga Ulah Mu Mayele (5:23)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/4-Bandzoko-4.53.mp3">Mantsieme_2024 - 4-Bandzoko (4:53)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/5-Cima-4.19.mp3">Mantsieme_2024 - 5-Cima (4:19)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/6-Kiluaro_Ngo-9.33.mp3">Mantsieme_2024 - 6-Kiluaro Ngo (9:33)</a>
        <a class="playlist-item" href="https://archive.org/download/2-mbali-a-ngo-10.00/7-Nta_Nta-7.23.mp3">Mantsieme_2024 - 7-Nta-Nta (7:23)</a>
      </div>
      <!-- End Playlists !-->
      <div>

    </div>
    
    <!-- End Custom Audio Player !-->
    <script src="assets/audioPlaylist.js"></script>
</body>
</html>
